<div class="login-container">

  <mat-card class="login-card">

    <h2 class="title">Login</h2>

    <form class="login-form">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>

        <input matInput type="email" placeholder="Enter your email" [(ngModel)]="email" name="email">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>

        <input matInput type="password" [(ngModel)]="password" name="password">
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width" (click)="login()">
        Login
      </button>

      <div class="divider">OR</div>

      <div id="googleBtn" class="google-btn"></div>

      <button mat-raised-button color="accent" class="full-width register-btn" (click)="goToRegister()">
        Register
      </button>

    </form>

  </mat-card>

</div>
