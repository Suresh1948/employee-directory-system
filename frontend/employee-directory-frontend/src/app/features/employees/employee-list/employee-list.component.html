<div class="page-wrapper">

  <!-- TOP BAR -->
  <div class="table-header">

    <mat-form-field appearance="outline" class="search-box">
      <mat-label>Search Employee</mat-label>

      <input matInput (keyup)="applyFilter($event)" placeholder="Search name/email">

      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="right-actions">

      <!-- LOGOUT (TOP) -->
      <button mat-icon-button color="primary" (click)="logout()" matTooltip="Logout">
        <mat-icon>logout</mat-icon>
      </button>
      <!-- CREATE (BELOW LOGOUT) -->
      <button mat-raised-button color="primary" *ngIf="isAdmin" (click)="createEmployee()">
        + Create Employee
      </button>

    </div>

  </div>
  <div class="table-CONTAINER">
    <!-- TABLE -->
    <div class="table-wrapper">

      <table mat-table [dataSource]="dataSource" class="full-width-table">

        <ng-container matColumnDef="sno">
          <th mat-header-cell *matHeaderCellDef> S.No </th>
          <td mat-cell *matCellDef="let emp; let i = index">
            {{ i + 1 }}
          </td>
        </ng-container>

        <ng-container matColumnDef="firstName">
          <th mat-header-cell *matHeaderCellDef>First Name</th>
          <td mat-cell *matCellDef="let emp">{{ emp.firstName }}</td>
        </ng-container>

        <ng-container matColumnDef="lastName">
          <th mat-header-cell *matHeaderCellDef>Last Name</th>
          <td mat-cell *matCellDef="let emp">{{ emp.lastName }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let emp">{{ emp.email }}</td>
        </ng-container>

        <ng-container matColumnDef="department">
          <th mat-header-cell *matHeaderCellDef>Department</th>
          <td mat-cell *matCellDef="let emp">{{ emp.department }}</td>
        </ng-container>

        <ng-container matColumnDef="joinedOn">
          <th mat-header-cell *matHeaderCellDef>JoinedOn</th>
          <td mat-cell *matCellDef="let emp">{{ emp.joinedOn | date:'dd-MM-yyyy' }}</td>
        </ng-container>


        <ng-container matColumnDef="mobileNo">
          <th mat-header-cell *matHeaderCellDef>MobileNo</th>
          <td mat-cell *matCellDef="let emp">{{ emp.mobileNo }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let emp">{{ emp.status }}</td>
        </ng-container>


        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let emp">
            <button *ngIf="isAdmin" mat-icon-button color="primary" (click)="editEmployee(emp)">
              <mat-icon>edit</mat-icon>
            </button>

            <button *ngIf="isAdmin" mat-icon-button color="warn" (click)="deleteEmployee(emp.id)">
              <mat-icon>delete</mat-icon>
            </button>

          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      </table>


    </div>
    <!-- PAGINATOR -->
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5,10,20]" showFirstLastButtons>
    </mat-paginator>

  </div>

</div>
